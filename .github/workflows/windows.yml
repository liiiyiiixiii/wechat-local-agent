name: Windows acceptance
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - run: python -m pip install -c requirements-windows-py311.lock -e ".[documents]"
      - run: python -m unittest discover -s tests -v
      - run: python -m wxlocal.archive.sqlcipher self-test
